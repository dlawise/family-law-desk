<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Family Letter Desk</title>

<style>
/* Layout: two-pane workbench. Details on the left, the letter on a sheet of paper on the right.
   Phone: one pane at a time with a Details / Letter switch. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#17212b; --muted:#566371; --line:#d5dbe2;
  --accent:#1b4d5c; --accent-ink:#ffffff; --accent-soft:#dfecf0; --danger:#9b2c2c;
  --paper:#ffffff; --paper-ink:#1c1c1c; --paper-muted:#555a60; --paper-rule:#1b4d5c; --gap-bg:#fdeaa7; --gap-fg:#5a4300;
  --ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --surface-2:#212a33; --ink:#e6ebf0; --muted:#9aa6b3; --line:#2f3a45;
  --accent:#74b8cc; --accent-ink:#0b1a20; --accent-soft:#1f3640; --danger:#f19a9a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --surface-2:#212a33; --ink:#e6ebf0; --muted:#9aa6b3; --line:#2f3a45;
  --accent:#74b8cc; --accent-ink:#0b1a20; --accent-soft:#1f3640; --danger:#f19a9a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:18px 10px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.hd-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--danger);color:var(--danger)}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.tab{flex:none;border:0;background:none;padding:11px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.mswitch{display:none;gap:0;margin-bottom:12px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mswitch button{flex:1;border:0;background:var(--surface);padding:9px;cursor:pointer;font-weight:500}
.mswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.split{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
.panel{min-width:0}
.form{display:flex;flex-direction:column;gap:10px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.sec>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";color:var(--muted);font-weight:400;font-size:18px;line-height:1}
details.sec[open]>summary::after{content:"\2212"}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;padding:2px 14px 14px}
.f{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;min-width:0}
.f.half{grid-column:auto}
.f label{font-size:12.5px;color:var(--muted);font-weight:500}
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=number],.f select,.f textarea{
  width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:7px 9px}
.f textarea{resize:vertical;line-height:1.45}
.f .hint{font-size:12px;color:var(--muted)}
.f.chk{flex-direction:row;align-items:flex-start;gap:8px}
.f.chk input{margin-top:3px;accent-color:var(--accent)}
.f.chk label{color:var(--ink);font-size:13.5px;font-weight:400}
.privacy{font-size:12px;color:var(--muted);padding:2px 4px}

.out{display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:10;background:var(--bg);padding-block:4px}
.status{font-size:12.5px;color:var(--muted);flex:1 1 220px;min-width:0}
.status.stale{color:var(--danger);font-weight:600}
.stalebar{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border:1px solid var(--danger);border-radius:6px;color:var(--danger);background:var(--surface)}
.stalebar.on{display:flex}
.sheet{overflow-x:auto;padding:0}

/* The paper stays white in both themes, like a printed letter */
.paper{background:var(--paper);color:var(--paper-ink);font:14.5px/1.6 var(--serif);max-width:794px;margin:0 auto;
  padding:clamp(22px,5vw,56px) clamp(18px,6vw,64px);box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.08);border-radius:2px;min-height:60vh;overflow-wrap:anywhere}
.paper:focus{outline:2px solid var(--accent);outline-offset:3px}
.paper p{margin:0 0 .85em}
.paper h2{font:600 15px/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;margin:0 0 .9em;color:var(--paper-rule)}
.paper h3{font:600 14.5px/1.4 var(--serif);margin:1.3em 0 .4em}
.paper ul,.paper ol{margin:0 0 .85em;padding-left:1.4em}
.paper li{margin-bottom:.3em}
.paper .lh{border-bottom:2px solid var(--paper-rule);padding-bottom:12px;margin-bottom:22px}
.paper .lh .firm{font:700 21px/1.2 var(--ui);letter-spacing:-.01em;color:var(--paper-rule)}
.paper .lh div{font:12.5px/1.5 var(--ui);color:var(--paper-muted)}
.paper .addr{margin-bottom:1.1em}
.paper .conf{font:600 11.5px var(--ui);letter-spacing:.12em;text-transform:uppercase;margin-bottom:.5em;color:var(--paper-muted)}
.paper .refs{font:12.5px/1.5 var(--ui);color:var(--paper-muted)}
.paper .re{font-weight:600;margin:1.2em 0 1em}
.paper .re span{font-weight:400}
.paper table{border-collapse:collapse;width:100%;margin:0 0 1em;font-size:14px}
.paper th,.paper td{border:1px solid #c9ced4;padding:6px 9px;text-align:left;vertical-align:top}
.paper th{background:#f1f3f5;font:600 12px var(--ui);width:32%}
.paper table.grid th{width:auto;text-transform:uppercase;letter-spacing:.06em}
.paper .sig{margin-top:2.6em}
.paper .gap{background:var(--gap-bg);color:var(--gap-fg);border-radius:2px;padding:0 3px;font-family:var(--ui);font-size:.9em}
.paper .enc{font:12.5px var(--ui);color:var(--paper-muted);margin-top:1.4em}

.docs .note{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:0}
.docs .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.filelist{grid-column:1/-1;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.filelist li{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px}
.filelist li span{min-width:0;overflow-wrap:anywhere}
.filelist button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.dstatus{grid-column:1/-1;font-size:13px;color:var(--muted)}
.dstatus.err{color:var(--danger);font-weight:600}
.res{grid-column:1/-1;font-size:13px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.res p{margin:0}
.res ul{margin:0;padding-left:18px}
.res .lbl{font-weight:600}
.paper .accept td{height:38px}
.paper .clientconf{margin-top:2em;break-inside:avoid}

.paper .stdinfo{border-top:1px dashed #b5bbc2;margin-top:2.2em;padding-top:1.2em}
.std .blk{border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.std .blk>summary{padding:8px 10px;font-weight:500;font-size:13px}
.std .blk .in{padding:2px 10px 10px;display:flex;flex-direction:column;gap:8px}
.std .tk{display:flex;flex-wrap:wrap;gap:4px 12px}
.std .tk label{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--ink);font-weight:400}
.std .inc{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.std .inc label{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;color:var(--ink);font-weight:400}
.std .inc input{margin-top:3px;accent-color:var(--accent)}
.std .grp{grid-column:1/-1;font-weight:600;font-size:12.5px;color:var(--muted);margin-top:4px}
.mbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-bottom:8px}
.mbar label{font-weight:600;font-size:12.5px;color:var(--muted)}
.mbar select,.mbar input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0}
.mbar select{max-width:260px}.mbar input{flex:1 1 200px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.tabs.views{position:static;margin-bottom:12px}
.groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.gbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:500}
.gbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.vh{margin:4px 0 12px;font-size:18px}
.vstack{display:flex;flex-direction:column;gap:10px;max-width:760px}
.imgprev{border:1px dashed var(--line);border-radius:6px;padding:8px;background:#fff;min-height:44px;display:flex;align-items:center}
.imgprev img{max-height:70px;max-width:100%}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#lock[hidden]{display:none}
.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px}
.lockcard h2{margin:0;font-size:18px}.lockcard p{margin:0}.lockcard input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:9px}
.lockerr{color:var(--danger);font-weight:600;min-height:1.2em}
.paper .sigimg{display:block;max-height:64px;max-width:240px;margin:14px 0 2px}
.paper .sig.has{margin-top:.4em}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface-2)}
.hrow .hmain{flex:1 1 220px;min-width:0}
@media print{
  @page{margin:18mm}
  .revbar,.modal,.top,.mbar,.views,.groups,.tabs,.mswitch,.form,.toolbar,.stalebar,#vOther,.toast,#lock{display:none!important}
  body{background:#fff!important;color:#000!important;padding:0!important}
  .wrap{max-width:none}.split{display:block}.split[data-view] .out{display:block!important}.sheet{overflow:visible}
  .paper{box-shadow:none!important;padding:0!important;max-width:none!important;min-height:0!important;margin:0!important}
  .paper .gap{background:none!important;color:inherit!important}
}
.revbar{margin:0 0 10px;padding:8px 12px;border:1px solid #c98a00;background:var(--surface-2);border-radius:8px;font-size:13px}
.xcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--surface)}.xcard blockquote{margin:0 0 6px;padding-left:10px;border-left:3px solid var(--line);color:var(--muted);font-size:13px}.xcard p{margin:0 0 6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.mcard{background:var(--surface);color:var(--ink);border-radius:12px;padding:16px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:8px;max-height:90vh;overflow:auto}.mcard label{display:flex;flex-direction:column;gap:2px;font-size:12px}.mcard input,.mcard textarea{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:6px;padding:6px 8px;font:inherit}
.needs{border:1px solid #c98a00;background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:0 0 12px}.needs h3{margin:0 0 2px;font-size:14px}.docview{max-height:420px;overflow:auto;font-size:13px}mark{background:#ffe27a;color:inherit}
.twrap{overflow-x:auto}
table.ledger{border-collapse:collapse;width:100%;font-size:13px}
table.ledger th,table.ledger td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
table.ledger th{background:var(--surface-2);font-weight:600;font-size:12px}
table.ledger input[type=text],table.ledger input[type=date],table.ledger input[type=number]{width:100%;min-width:70px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:4px 6px}
table.ledger input[type=number]{min-width:56px}
.totals{display:flex;flex-wrap:wrap;gap:8px 18px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.totals .stat{display:flex;flex-direction:column;min-width:110px}.totals .sl{font-size:12px;color:var(--muted)}.totals strong{font-size:15px;font-variant-numeric:tabular-nums}
.estbar{flex:1 1 100%;display:flex;flex-direction:column;gap:4px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
select,textarea,input[type=text],input[type=number],input[type=date],input[type=password],input[type=email]{background-color:var(--surface);color:var(--ink)}select{border:1px solid var(--line);border-radius:6px;padding:4px 8px}option{background:var(--surface);color:var(--ink)}.imgprev .hint{color:#4a5560}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.skip{position:absolute;left:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:6px;z-index:100}.skip:focus{top:8px}main:focus{outline:none}select,input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],input[type=file]{min-height:32px}input[type=checkbox],input[type=radio]{width:24px;height:24px}.hrow.rem.over{border-left:4px solid var(--danger)}.bar .fill{height:100%;background:var(--accent)}.bar .fill.warn{background:#c98a00}.bar .fill.over{background:var(--danger)}
.erows{display:flex;flex-direction:column;gap:8px}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.erow label{display:flex;flex-direction:column;gap:2px;font-size:12px}
.erow input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;min-width:0}
.erow label:first-child{flex:1 1 220px}.erow input[type=number]{width:90px}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.crow.na{opacity:.55}
.crow .cmain{display:flex;gap:8px;align-items:flex-start;flex:1 1 280px;min-width:0}
.crow .cmain input{margin-top:3px;accent-color:var(--accent)}
.crow .cmain label{font-size:13.5px;color:var(--ink);font-weight:400}
.crow .cna{display:flex;align-items:center;gap:4px}
.crow input[type=text]{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-weight:500;z-index:50;opacity:0;pointer-events:none;transition:opacity .15s;max-width:90vw}
.toast.on{opacity:1}

@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr)}
  .mswitch{display:flex}
  .split[data-view="form"] .out{display:none}
  .split[data-view="letter"] .form{display:none}
  .toolbar{top:calc(env(safe-area-inset-top,0px) + 46px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the main content</a>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Family Letter Desk</h1>
      <p>Client care, advice, hearing, outcome and closing letters, and attendance notes. England and Wales.</p>
    </div>
    <div class="hd-actions">
      <button class="btn" id="btnLock" type="button" hidden>Lock</button>
    </div>
  </header>
<main id="main" tabindex="-1">
  <div class="mbar" id="mbar">
    <label for="matterSel">Matter</label>
    <select id="matterSel"></select>
    <input id="matterName" type="text" aria-label="Matter name" autocomplete="off">
    <button class="btn" id="btnNewMatter" type="button">New</button>
    <button class="btn" id="btnDupMatter" type="button">Duplicate</button>
    <button class="btn" id="btnExampleMatter" type="button">Add example</button>
    <button class="btn warn" id="btnDelMatter" type="button">Delete matter</button>
    <span class="chip" id="chkChip" hidden></span>
  </div>
  <div class="tabs views" role="tablist" id="views" aria-label="Sections"></div>

  <div id="vOther" hidden></div>
  <div id="vLetters">
  <div class="groups" id="groups" role="group" aria-label="Kind of document"></div>
  <div class="tabs" role="tablist" id="tabs" aria-label="Document type"></div>

  <div class="mswitch" id="mswitch">
    <button type="button" id="mvForm" aria-pressed="true">Details</button>
    <button type="button" id="mvLetter" aria-pressed="false">Letter</button>
  </div>

  <p class="revbar" id="revbar" hidden></p>
  <div class="split" id="split" data-view="form">
    <section class="panel form" id="form" aria-label="Matter details"></section>
    <section class="panel out" aria-label="Letter preview">
      <h2 class="sr">Letter preview</h2>
      <div class="toolbar">
        <button class="btn primary" id="btnDocx" type="button">Download Word</button>
        <button class="btn" id="btnCopyRich" type="button">Copy for Word</button>
        <button class="btn" id="btnPrint" type="button">Print or save as PDF</button>
        <button class="btn" id="btnSaveFile" type="button">Save to matter file</button>
        <button class="btn" id="btnCopyText" type="button">Copy plain text</button>
        <button class="btn" id="btnEmail" type="button">Email helper</button>
        <button class="btn" id="btnRebuild" type="button">Rebuild from details</button>
        <span class="status" id="status" role="status"></span>
      </div>
      <div class="stalebar" id="stalebar">
        <span>You edited this document by hand. Changes to the details on the left are not applied until you rebuild.</span>
        <button class="btn" id="btnRebuild2" type="button">Rebuild and lose my edits</button>
      </div>
      <div class="fmtbar" id="fmtbar" role="toolbar" aria-label="Formatting"></div>
      <div class="sheet"><article class="paper" id="paper" contenteditable="true" spellcheck="true" aria-label="Document. You can edit the text directly."></article></div>
    </section>
  </div>
  </div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
var TYPES=[
  {id:"care",label:"Client care letter",g:"Client letters"},
  {id:"advice",label:"Advice letter",g:"Client letters"},
  {id:"progress",label:"Progress update",g:"Client letters"},
  {id:"appointment",label:"Appointment",g:"Client letters"},
  {id:"docrequest",label:"Documents needed",g:"Client letters"},
  {id:"notice",label:"Notice of hearing",g:"Client letters"},
  {id:"outcome",label:"Outcome letter",g:"Client letters"},
  {id:"offer",label:"Settlement offer",g:"Client letters"},
  {id:"costs",label:"Costs update",g:"Client letters"},
  {id:"closing",label:"Closing letter",g:"Client letters"},
  {id:"tosols",label:"To other solicitors",g:"Other parties"},
  {id:"tocourt",label:"To the court",g:"Other parties"},
  {id:"consent",label:"Consent order cover",g:"Other parties"},
  {id:"counsel",label:"Instruct counsel",g:"Other parties"},
  {id:"note",label:"Attendance note",g:"File"}
];
var GROUPS=["Client letters","Other parties","File"];
var ALL=TYPES.map(function(t){return t.id});

divorce:{h:"The divorce",t:"To divorce in England and Wales you must have been married for at least one year and the marriage must have broken down irretrievably. You do not need to give a reason or blame the other person (Divorce, Dissolution and Separation Act 2020). Either of you can apply, or you can apply together. There is a minimum period of 20 weeks between the application being issued and an application for a conditional order. After the conditional order there is a further six weeks and one day before you can apply for the final order, which is the order that ends the marriage. Please do not apply for the final order until your financial arrangements have been resolved and approved by the court, unless we have first discussed the consequences with you, such as the loss of pension or inheritance rights."},
finances:{h:"Your finances",t:"Financial matters on divorce are decided under the Matrimonial Causes Act 1973. The court looks at all the circumstances, including the needs of both of you and of any children, the length of the marriage, your incomes, assets and earning capacity, and your contributions. The welfare of any child of the family under 18 is the court's first consideration. Both of you must give full and frank financial disclosure, usually on Form E with supporting documents such as bank statements and pension valuations. Where you reach agreement, it should be recorded in a consent order approved by the court. Without a court order, financial claims against each other can generally remain open even after the divorce is finalised. If agreement cannot be reached, an application for a financial remedy order is made on Form A, and the case normally goes through a first appointment, a financial dispute resolution (FDR) appointment and, if necessary, a final hearing."},
children:{h:"Arrangements for your children",t:"Where parents cannot agree arrangements for their children, the court's paramount consideration is the welfare of the child (Children Act 1989). The court starts from the position that involvement of both parents will further the child's welfare, unless the contrary is shown, and it considers the factors in the welfare checklist, including the child's wishes and feelings, their needs, and any risk of harm. The court will make an order only if doing so is better for the child than making no order. Where you and the other parent can agree arrangements, I encourage you to do so. If agreement is not possible, an application can be made for a child arrangements order on Form C100. Cafcass will normally carry out safeguarding checks and the court will list a first hearing."},
protection:{h:"Protection from abuse",t:"If you or your children are at risk of harm, the court can make a non-molestation order under Part 4 of the Family Law Act 1996 to protect you, and an occupation order regulating who may live in the family home. In appropriate cases an application can be made urgently and without notice to the other person. If you are in immediate danger, please call 999. Please keep copies of any messages, photographs or records of incidents, and tell me straight away if anything changes."},
mediation:{h:"Mediation",t:"Before most applications to court about children or finances you are normally required to attend a Mediation Information and Assessment Meeting (MIAM) with an authorised mediator, unless an exemption applies, for example where there has been domestic abuse or where the matter is urgent. Mediation can often resolve matters more quickly and at lower cost than court proceedings, and the court expects you to have considered it. I can refer you to a mediator if you wish, and I can continue to advise you alongside the mediation process."}

function careAdvice(){
  var h="",n=0;
  if(S.o_nmo){n++;
    h+="<h3>Non-molestation order</h3><p>A non-molestation order is an order of the family court under the Family Law Act 1996. It can stop the other party from using or threatening violence against you or your children, and from intimidating, harassing or pestering you. The court can make it where you and the other party are associated, for example if you are or were partners, live or lived in the same household, are related, or are the parents of a child, and where an order is needed to protect your health, safety and well-being or that of a child.</p>";
    if(S.o_nmo_wn)h+="<p>Because of the risk you have described, we may ask the court to make the order without telling the other party first (a &quot;without notice&quot; application). The court can do this where there is urgency or a risk of harm, but it will then set a short return date when the other party can respond. Where we apply without notice, we must give the court a full and fair account, including anything that does not help you, so I need you to be completely open with me. A without notice order only protects you once the other party has been told about it, so the order must be served on them. I will explain how and when this will happen. You will need to attend the return date hearing.</p>";
    else h+="<p>We will apply with notice, which means the other party is told about the application and can respond to it. The court may make an order at the first hearing, or give directions for statements and a further hearing. The other party may offer undertakings, which are formal promises to the court, instead of an order. I will advise you on whether to accept them if that happens.</p>";
    h+="<p>If an order is made, breaking it is a criminal offence, and you should call the police if it is broken. Please then tell me as well. An order lasts for the time the court sets, and it can be extended on application.</p>";}
  if(S.o_occ){n++;
    h+="<h3>Occupation order</h3><p>An occupation order decides who may live in the home, and can require the other party to leave or keep away from the home or part of it, or allow you to return. The rules depend on whether you or the other party own or rent the home or have a right to occupy it, and on your relationship. In making a decision, the court looks at all the circumstances, including your housing needs and resources, the effect on your health, safety and well-being and that of any child, and the conduct of each of you. Occupation orders usually last for a limited period. I will explain how this applies to your situation once I have the details about the home.</p>";}
  if(S.o_cao){n++;
    h+="<h3>Child arrangements order</h3><p>A child arrangements order, made under section 8 of the Children Act 1989, decides who a child lives with, when the child spends time with the other parent, and in what way. The court's main concern is the child's welfare. It will decide with reference to the welfare checklist in the Act, which includes the child's wishes and feelings, needs and any risk of harm. The court normally expects people to try to resolve things first, by a mediation information and assessment meeting (MIAM). There is an exemption where there is evidence of domestic abuse, and I will explain what evidence is accepted. Cafcass will usually carry out safeguarding checks and may talk to you and to the other party. Where domestic abuse is alleged, the court will follow Practice Direction 12J and may decide whether to hold a hearing to decide the facts before deciding arrangements. If you are worried about seeing the other party at court, I can ask for special measures, such as separate waiting areas or a screen.</p>";}
  if(S.o_pso){n++;
    h+="<h3>Prohibited steps order</h3><p>A prohibited steps order stops a person from taking a particular step in relation to a child without the court's permission, for example removing the child from your care, from the area or from the country, or changing the child's school. We will ask the court for the specific wording that fits your concerns.</p>";}
  if(S.o_sio){n++;
    h+="<h3>Specific issue order</h3><p>A specific issue order asks the court to decide a particular question about a child's upbringing where the parents cannot agree, for example about schooling, medical treatment or moving to live elsewhere. The court will decide the question based on the child's welfare.</p>";}
  if(!n)h+="<p>"+gap("orders you want the court to make")+"</p>";
  return h;
}

  var fk=forcedKind({text:text});if(fk)return fk==="Notice of hearing"?"Court order":fk;
  var t=(name+" "+String(text||"").slice(0,1500)).toLowerCase();
  if(/witness statement|statement of truth|make this statement/.test(t))return"Witness statement";
  if(/instruction form|client information|intake|client questionnaire/.test(t))return"Instruction form";
  if(/attendance note|file note|telephone attendance/.test(t))return"Attendance note";
  if(/\border\b.*(made|before)|it is ordered|penal notice|notice of hearing|directions/.test(t))return"Court order";

function snippetsOf(text,terms,max){
